[package]
name = "api"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.5.3"
async-trait = "0.1.92"
axum = "0.8.9"
chrono = { version = "0.4.45", default-features = false, features = ["serde", "clock"] }
dotenvy = "0.15.7"
hex = "0.4.3"
jsonwebtoken = { version = "11.0.0", default-features = false, features = ["rust_crypto"] }
lettre = { version = "0.11.23", default-features = false, features = ["builder", "hostname", "pool", "smtp-transport", "tokio1", "tokio1-rustls", "ring", "webpki-roots", "tracing"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "migrate", "macros", "uuid", "chrono"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.0", features = ["cors"] }
tracing = "0.1.44"
tracing-subscriber = {version = "0.3.23", features = ["env-filter"]}
uuid = { version = "1.24.1", features = ["v4", "serde"] }
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid"] }
utoipa-axum = "0.2.0"
validator = { version = "0.21.0", features = ["derive"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "http2", "charset", "query"] }

[dev-dependencies]
cucumber = "0.23.0"
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }

[[test]]
name = "bdd"
harness = false
